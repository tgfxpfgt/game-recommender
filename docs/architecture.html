<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>游戏雷达 — 架构总览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font: 14px/1.6 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    h1 { text-align: center; color: #67c1f5; margin-bottom: 4px; }
    .ver { text-align: center; color: #888; margin-bottom: 20px; }
    .stats { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat { background: #16213e; padding: 10px 20px; border-radius: 8px; text-align: center; }
    .stat b { display: block; font-size: 24px; color: #67c1f5; }
    .stat small { color: #888; }
    .diagram { max-width: 1100px; margin: 0 auto 30px; }
    .modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .module { background: #16213e; border: 1px solid #333; border-radius: 10px; padding: 14px; border-left: 4px solid var(--c); }
    .module h3 { color: var(--c); font-size: 15px; margin-bottom: 4px; }
    .module .meta { color: #888; font-size: 12px; margin-bottom: 6px; }
    .module p { font-size: 12px; color: #aaa; }
    .flows { max-width: 1100px; margin: 0 auto; }
    .flows h2 { color: #67c1f5; font-size: 16px; margin-bottom: 12px; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .flow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    .flow .arrow { color: #555; }
    .flow .from { color: #aaa; min-width: 160px; text-align: right; }
    .flow .to { color: #aaa; min-width: 180px; }
    .flow .lbl { flex: 1; color: #ddd; }
    .flow .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .knowledge { max-width: 1100px; margin: 20px auto; background: #16213e; border-radius: 10px; padding: 16px; }
    .knowledge h2 { color: #67c1f5; font-size: 16px; margin-bottom: 10px; }
    .knowledge a { color: #67c1f5; text-decoration: none; }
    .footer { text-align: center; color: #555; font-size: 12px; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>🎮 游戏雷达 Game Radar</h1>
  <p class="ver" id="ver">v—</p>
  <div class="stats" id="stats"></div>

  <div class="diagram">
    <div class="modules" id="modules"></div>
  </div>

  <div class="flows">
    <h2>📡 核心数据流</h2>
    <div id="flows"></div>
  </div>

  <div class="knowledge">
    <h2>📚 深入阅读</h2>
    <p>工作逻辑知识库：<a href="KNOWLEDGE.md">docs/KNOWLEDGE.md</a> — 匹配管线、双波推送、存储模型、消息契约、单源表</p>
    <p>编码规则：<a href="../AGENTS.md">AGENTS.md</a> — 铁律/门禁/单源化纪律</p>
  </div>

  <div class="footer">由 scripts/generate-architecture.mjs 自动生成 · 数据: architecture-data.json</div>

  <script>
    fetch('architecture-data.json')
      .then((r) => r.json())
      .then((data) => {
        document.getElementById('ver').textContent = 'v' + data.version;
        // 统计卡
        const s = data.stats;
        const totalLines = data.nodes.reduce((a, n) => a + n.lines, 0);
        const totalFiles = data.nodes.reduce((a, n) => a + n.files, 0);
        document.getElementById('stats').innerHTML = `
          <div class="stat"><b>${data.version}</b><small>版本</small></div>
          <div class="stat"><b>${totalFiles}</b><small>文件</small></div>
          <div class="stat"><b>${totalLines.toLocaleString()}</b><small>代码行</small></div>
          <div class="stat"><b>${s.actionCount}</b><small>消息 action</small></div>
          <div class="stat"><b>${s.storageCount}</b><small>存储模块</small></div>
          <div class="stat"><b>${s.suiteCount}</b><small>测试套件</small></div>`;
        // 模块卡
        document.getElementById('modules').innerHTML = data.nodes
          .map((n) => `
            <div class="module" style="--c:${n.color}">
              <h3>${n.label}</h3>
              <div class="meta">${n.files} 文件 · ${n.lines.toLocaleString()} 行</div>
              <p>${n.desc}</p>
            </div>`)
          .join('');
        // 数据流
        document.getElementById('flows').innerHTML = data.flows
          .map((f) => {
            const node = data.nodes.find((n) => n.label === f.from);
            const color = node ? node.color : '#888';
            return `<div class="flow">
              <span class="dot" style="background:${color}"></span>
              <span class="from">${f.from}</span>
              <span class="arrow">──→</span>
              <span class="to">${f.to}</span>
              <span class="lbl">${f.label}</span>
            </div>`;
          })
          .join('');
      })
      .catch(() => {
        document.getElementById('ver').textContent = '（数据文件未生成——运行 node scripts/generate-architecture.mjs）';
      });
  </script>
</body>
</html>
