name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v4.1.2：重复推送自动取消旧运行 / cancel stale runs on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # v7.0.7：全历史检出——coverage:gate 需要对比 origin/main/HEAD~1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # v4.1.2 修复：此前缺少 npm ci，lint 无 eslint 必然失败（CI 曾 8 次全红）
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 运行 Lint / Run ESLint
        run: npm run lint
      - name: 运行类型检查 / Run TypeScript check
        run: npm run typecheck
      # v7.3.0：vitest 分片并行（test/test-2 各跑一半套件，CI 墙钟减半）
      - name: 运行测试套件 1/2 / Run test shard 1/2
        run: npx vitest run --shard=1/2

  test-2:
    # v7.3.0：vitest 分片并行（与 test job 各跑一半）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 运行测试套件 2/2 / Run test shard 2/2
        run: npx vitest run --shard=2/2

  coverage-gate:
    # v7.0.7 T1：新增业务文件覆盖率门槛（行覆盖 <50% 拒绝）；依赖两个 shard 完成
    runs-on: ubuntu-latest
    needs: [test, test-2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 新增文件覆盖率门槛 / Coverage gate
        run: npm run coverage:gate
      - name: 全局覆盖率下限 / Global coverage floor (v10.5.0 P1-D)
        run: npm run coverage

  release-smoke:
    # v10.5.0 P1-D：发布产物在 CI 构建 + 校验（此前打包 zip 从未被构建/冒烟）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 构建发布 zip / Build release zip
        run: npm run package
      - name: 校验发布产物 / Validate release artifact
        run: |
          set -e
          VER=$(node -p "require('./manifest.json').version")
          ZIP="release/game-recommender-v${VER}.zip"
          test -f "$ZIP" || { echo "❌ 缺少 $ZIP"; exit 1; }
          LIST=$(unzip -l "$ZIP")
          echo "$LIST" | grep -q "manifest.json" || { echo "❌ zip 缺 manifest.json"; exit 1; }
          echo "$LIST" | grep -q "background/service-worker.js" || { echo "❌ zip 缺 service-worker"; exit 1; }
          if echo "$LIST" | grep -Eq "node_modules/|^.*[[:space:]]tests/"; then
            echo "❌ zip 泄漏 node_modules/tests"; exit 1
          fi
          echo "✅ 发布产物校验通过：$ZIP"

  perf:
    # v7.3.0：测试性能预算门禁——全量 vitest 超过 90s（CI 冷机阈值，本地 ~15s）拒绝
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 测试耗时预算 / Test timing budget
        run: npm run test:timed -- --budget 90

  e2e:
    # v3.4.1：浏览器端 E2E 冒烟（安装微软官方 Edge，xvfb 虚拟显示跑非无头）
    # Browser E2E smoke: installs Microsoft Edge from the official apt repo,
    # runs the non-headless suite under xvfb.
    # v7.3.0：E2E_MOCK=1 全量离线回放（含详情页真实检索段——网络来自录制 fixture，
    # CI 不再依赖外部网络可用性，且第 4 节回归可复现）
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      # v10.5.1 任务3：改用固定版本 Playwright Chromium（匹配 playwright-core），
      # 规避托管机最新版系统 Chrome 偶发发现不到 MV3 Service Worker（扩展 id=null）
      - name: 安装 Playwright Chromium / Install pinned Playwright Chromium
        run: npx playwright-core install chromium
      - name: 运行 E2E 冒烟（离线回放全量）/ Run E2E smoke (offline replay, full)
        run: xvfb-run -a env E2E_MOCK=1 npm run e2e

  visual:
    # v10.5.1 任务3：视觉回归独立作业——基线在开发者 Windows 机采集，Linux CI
    # 字体/抗锯齿导致全页 ~3% 均匀像素差（与真实回归无关）。单次失败保持
    # advisory（不阻断）；v10.6.0 E4：连续 2 次失败升级为阻断——经 actions/cache
    # 跨 run 传递失败标记（key 用 run_id 追加，restore-keys 取最近一次）。
    # Visual regression stays advisory on a single failure (Linux font noise vs
    # Windows baselines); E4 escalates to blocking after 2 consecutive failures
    # via a cache-carried failure marker.
    runs-on: ubuntu-latest
    needs: [coverage-gate]
    steps:
      - uses: actions/checkout@v4
      - name: 读取上次失败标记 / Restore previous failure marker
        uses: actions/cache/restore@v4
        with:
          path: tests/visual/.prev-failed
          key: visual-state-${{ github.run_id }}
          restore-keys: visual-state-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 安装 Playwright Chromium / Install pinned Playwright Chromium
        run: npx playwright-core install chromium
      - name: 运行视觉回归（单次失败 advisory）/ Run visual regression
        id: visual
        run: xvfb-run -a npm run visual
        continue-on-error: true
      - name: 连续失败升级为阻断 / Escalate after 2 consecutive failures
        env:
          VISUAL_FAILED: ${{ steps.visual.outcome == 'failure' }}
        run: |
          prev=$(cat tests/visual/.prev-failed 2>/dev/null || echo 0)
          if [ "$VISUAL_FAILED" = "true" ] && [ "$prev" = "1" ]; then
            echo "::error::视觉回归连续 2 次失败——升级为阻断（疑似真实回归，请核对 visual-diff 工件）"
            echo 1 > tests/visual/.prev-failed
            exit 1
          fi
          if [ "$VISUAL_FAILED" = "true" ]; then echo 1 > tests/visual/.prev-failed; else echo 0 > tests/visual/.prev-failed; fi
      - name: 保存失败标记 / Save failure marker
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/visual/.prev-failed
          key: visual-state-${{ github.run_id }}
      - name: 上传视觉 diff / Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: tests/visual/diff/
          if-no-files-found: ignore

  security:
    # v7.0.7 S1/S2：依赖漏洞审计 + Secret 泄漏扫描（密钥/Token 防泄漏防线）
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖 / Install dependencies
        run: npm ci
      - name: 依赖漏洞审计 / npm audit
        run: npm audit --audit-level=high
      - name: Secret 扫描 / Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
